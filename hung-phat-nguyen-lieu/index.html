<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Hung Phat — E-card</title>
  <link rel="stylesheet" href="assets/css/shared.css">
  <meta name="robots" content="noarchive">
  <style>
    :root{--navy:#10221a;--navy-2:#173B67;--accent:#BFECC8;--gold:#C99A2E;--bg:#FFFFFF;--white:#FFFFFF;--text:#18202A;--muted:#657080}
    html,body{background:var(--bg);margin:0;height:100%;}
    .page{display:flex;align-items:center;justify-content:center;padding:12px 8px;min-height:100vh;min-height:-webkit-fill-available;overflow:hidden}
    .card{width:100%;max-width:410px;background:transparent;border-radius:16px;overflow:hidden;display:flex;flex-direction:column;height:100%;max-height:calc(100vh - 24px)}
    .hero{width:100%;height:190px;display:block;object-fit:cover;object-position:center}
    .hero-copy{padding:12px 18px 0;text-align:center}
    .hero-copy p{margin:0;font-size:13px;color:var(--muted);line-height:1.5;letter-spacing:.02em}
    .sheet{background:var(--white);border-radius:28px;margin-top:-20px;padding:16px 16px 14px;box-sizing:border-box;display:flex;flex-direction:column;flex:1;justify-content:space-between;overflow:hidden}
    .title{color:var(--navy);text-align:center;font-weight:700;font-size:18px;line-height:1.1;margin:4px 0}
    .kicker{display:none}
    .person{display:block;text-align:center;margin:8px 0}
    .person .name{color:var(--text);font-weight:600;font-size:16px}
    .person .role{color:var(--muted);font-size:13px}
    .actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:16px 0}
    .btn{height:50px;border-radius:14px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:13px;text-decoration:none;box-sizing:border-box;box-shadow:0 10px 20px rgba(10,35,66,0.08);transition:transform 0.2s ease,box-shadow 0.2s ease}
    .btn:hover{transform:translateY(-1px);box-shadow:0 14px 26px rgba(10,35,66,0.12)}
    .btn svg{width:20px;height:20px}
    .btn-call{background:var(--accent);color:var(--navy);border:0}
    .btn-light{background:var(--white);border:1px solid rgba(10,35,66,0.16);color:var(--text)}
    .address{display:flex;flex-direction:column;gap:6px;padding:14px;border-radius:16px;background:var(--white);border:1px solid rgba(10,35,66,0.08);font-size:13px;margin-top:10px;box-shadow:0 12px 25px rgba(10,35,66,0.04)}
    .address .line{color:var(--text);font-weight:600}
    .address .phones{color:var(--muted);font-size:13px}
    .products{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:16px 0}
    .product{background:var(--white);border-radius:16px;overflow:hidden;text-align:center;border:1px solid rgba(10,35,66,0.08);box-shadow:0 10px 24px rgba(10,35,66,0.06);display:flex;flex-direction:column;min-height:170px}
    .product img{width:100%;height:120px;object-fit:cover;display:block}
    .product .label{padding:12px;font-weight:700;color:var(--navy);font-size:14px;flex:1;display:flex;align-items:center;justify-content:center}
    @media(max-width:360px){.products{grid-template-columns:repeat(2,minmax(0,1fr))} .product img{height:100px}}
    .footer{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
    .small-btn{height:44px;display:flex;align-items:center;justify-content:center;padding:0 10px;border-radius:14px;background:var(--white);border:1px solid rgba(10,35,66,0.12);color:var(--navy);text-decoration:none;box-shadow:0 8px 20px rgba(10,35,66,0.06);font-weight:700}
    .small-btn:hover{transform:translateY(-1px)}
    .disabled{opacity:0.45;pointer-events:none}
    html,body,.page,.card{max-width:100%;overflow-x:hidden;overflow-y:hidden}
    @media(max-width:420px){
      .hero{height:170px}
      .sheet{padding:14px 14px 12px}
      .actions{gap:8px;margin:14px 0}
      .btn{height:46px;font-size:12px}
      .person{margin:6px 0;font-size:13px}
      .products{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:12px 0}
      .product img{height:90px}
      .product .label{padding:8px;font-size:13px}
      .footer{gap:8px;margin-top:12px}
    }
  </style>
</head>
<body>
  <div class="page">
    <main class="card" role="main">
      <img class="hero" src="assets/images/hero-hung-phat.png" alt="Hung Phat"/>
      <div class="hero-copy">
        <p>Nguyên liệu trà sữa · Mì cay · Thực phẩm đông lạnh</p>
      </div>

      <section class="sheet" aria-label="Công Ty TNHH TM Hưng Phát">

        <div class="person">
          <div class="name">Tân Đô</div>
          <div class="role">Kinh Doanh</div>
        </div>

        <nav class="actions" aria-label="Hành động">
          <a class="btn btn-call" href="tel:0798356565" aria-label="Gọi"> 
            <svg viewBox="0 0 24 24" fill="none" aria-hidden><path d="M6.6 10.2a15.6 15.6 0 006.2 6.2l1.6-1.6a1 1 0 01.9-.25c1 .25 2.1.4 3.3.4a1 1 0 011 1V20a1 1 0 01-1 1C9.4 21 3 14.6 3 6a1 1 0 011-1h2.5a1 1 0 011 1c0 1.2.2 2.3.4 3.3.08.35.02.74-.25.9l-1.6 1.6z" fill="#fff"/></svg>
            <span>Gọi</span>
          </a>
          <a class="btn btn-light" href="https://zalo.me/0798356565" target="_blank" rel="noopener" aria-label="Zalo">
            <span>Zalo</span>
          </a>
          <a class="btn btn-light" href="assets/files/tan-do-hung-phat.vcf" aria-label="Lưu liên hệ" download>
            <span>Lưu liên hệ</span>
          </a>
          <div class="btn btn-light" aria-hidden="true" style="display:flex;align-items:center;justify-content:center;font-weight:600">
            <div style="text-align:center">
              <div style="font-weight:700;color:var(--navy)">Tân Đô</div>
              <div style="font-size:13px;color:var(--muted)">Kinh Doanh</div>
            </div>
          </div>
        </nav>

        <div class="address" aria-label="Địa chỉ và hotline">
          <div class="line">📍 <a href="https://www.google.com/maps/search/?api=1&query=152+Yersin+Phuong+4+My+Tho+Tien+Giang" target="_blank" rel="noopener">152 Yersin, P.4, TP. Mỹ Tho, Tiền Giang</a></div>
          <div class="phones">☎ 079 835 6565</div>
        </div>

        <section class="products" aria-label="Danh mục sản phẩm">
          <a class="product" href="thong-tin.html#san-pham">
            <img src="assets/images/nguyen-lieu-tra-sua.webp" alt="Nguyên liệu trà sữa">
            <div class="label">Nguyên liệu trà sữa</div>
          </a>
          <a class="product" href="thong-tin.html#san-pham">
            <img src="assets/images/nguyen-lieu-mi-cay.webp" alt="Nguyên liệu mì cay">
            <div class="label">Nguyên liệu mì cay</div>
          </a>
          <a class="product" href="thong-tin.html#san-pham">
            <img src="assets/images/thuc-pham-dong-lanh.webp" alt="Thực phẩm đông lạnh">
            <div class="label">Thực phẩm đông lạnh</div>
          </a>
        </section>

        <div class="footer">
          <a class="small-btn" href="https://www.facebook.com/share/1EaNW3j1jL/" target="_blank" rel="noopener">Facebook</a>
          <a class="small-btn" href="https://www.google.com/maps/search/?api=1&query=152+Yersin+Phuong+4+My+Tho+Tien+Giang" target="_blank" rel="noopener">Chỉ đường</a>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
