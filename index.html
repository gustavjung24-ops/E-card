<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>E-Card Repository</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f5f0e6;
      font-family: Arial, "Helvetica Neue", sans-serif;
      color: #183024;
    }
    main {
      width: min(92%, 680px);
      background: #fffaf0;
      border: 1px solid rgba(180, 140, 70, .25);
      border-radius: 24px;
      padding: 28px;
      box-shadow: 0 18px 50px rgba(20,30,25,.12);
    }
    h1 {
      margin: 0 0 18px;
      font-size: 28px;
    }
    .list {
      display: grid;
      gap: 14px;
    }
    a {
      display: block;
      padding: 16px 18px;
      border-radius: 16px;
      text-decoration: none;
      color: #fff;
      background: linear-gradient(135deg, #173326, #2f6b45);
      font-weight: 700;
    }
    a span {
      display: block;
      margin-top: 5px;
      font-size: 13px;
      font-weight: 400;
      opacity: .88;
    }
  </style>
</head>
<body>
  <main>
    <h1>Danh sách E-Card</h1>

    <div class="list">
      <a href="./skf-congnghiep/">
        SKF Công Nghiệp E-Card
        <span>Phụ tùng công nghiệp / SKF Industrial</span>
      </a>

      <a href="./nguyen-thanh-vu-aka-homes/">
        Nguyễn Thanh Vũ - AKA Homes
        <span>Phó Giám Đốc Kinh Doanh / Bất động sản</span>
      </a>
    </div>
  </main>
</body>
</html>
